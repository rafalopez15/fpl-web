name: CI

# PRs run lint, formatting, type check, tests and build, then post one comment with
# the summaries. Pushes to main run them again on the merged code. Other branch
# pushes don't run CI until a PR is opened, so PR branches don't run everything twice.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Lint with ESLint
        # The JSON report is for the summary, which also prints each issue.
        run: npm run lint -- --format json --output-file eslint-report.json
      - name: Summarize ESLint results
        if: always()
        run: node .github/scripts/summarize-eslint.mjs eslint-report.json eslint-summary.md
      - name: Upload the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-summary-eslint
          path: eslint-summary.md
          if-no-files-found: ignore
          retention-days: 7

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Check formatting with Prettier
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee prettier.log
      - name: Summarize formatting
        if: always()
        run: node .github/scripts/summarize-prettier.mjs prettier.log formatting-summary.md
      - name: Upload the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-summary-formatting
          path: formatting-summary.md
          if-no-files-found: ignore
          retention-days: 7

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Type check
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
      - name: Summarize the type check
        if: always()
        env:
          OUTCOME: ${{ steps.typecheck.outcome }}
        run: node .github/scripts/summarize-log.mjs "Type check" "$OUTCOME" typecheck.log typecheck-summary.md
      - name: Upload the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-summary-typecheck
          path: typecheck-summary.md
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to download main's coverage report
      pull-requests: read # to list the PR's changed files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        # Fails under the gate in vitest.config.mts. The JSON report is for the summary.
        run: |
          npx vitest run --coverage --reporter=default --reporter=json \
            --outputFile.json=test-results.json
      - name: Summarize test results
        if: always()
        run: node .github/scripts/summarize-tests.mjs test-results.json tests-summary.md
      - name: Get main's coverage and the PR's changed files
        if: always() && github.event_name == 'pull_request'
        # Main's report is from its latest successful CI run. The changed files come
        # from GitHub's API, so they don't depend on how much history was fetched.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n coverage-main \
              -D baseline || echo "No coverage report on main's run $run_id"
          fi
          if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only > changed-files.txt; then
            cat changed-files.txt
          else
            echo "Couldn't list the PR's changed files"
            rm -f changed-files.txt
          fi
      - name: Summarize coverage
        if: always()
        run: |
          node .github/scripts/summarize-coverage.mjs coverage \
            baseline/coverage-summary.json changed-files.txt coverage-summary.md
      - name: Upload the summaries for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-summary-tests
          path: |
            tests-summary.md
            coverage-summary.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Save main's coverage for PRs to compare against
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-main
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 90

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Build
        # Catches server/client mistakes and prerender errors the other checks miss.
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Summarize the build
        if: always()
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: node .github/scripts/summarize-log.mjs "Build" "$OUTCOME" build.log build-summary.md
      - name: Upload the summary for the PR comment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-summary-build
          path: build-summary.md
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: PR comment
    # Runs after the other jobs even when they fail, so failures get reported.
    # Dependabot's runs get a read-only token, so they can't comment.
    if: always() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: [lint, format, typecheck, test, build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download the summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-summary-*
          merge-multiple: true
          path: summaries
      - name: Post or update the CI comment
        # One comment per PR, found by its hidden marker and edited in place on later
        # pushes, so the PR doesn't collect a comment per push.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- ci-report -->'
          section() {
            cat "summaries/$1" 2>/dev/null || echo "## ⚠️ $2 didn't report results"
            echo
          }
          {
            echo "$marker"
            echo "**CI for \`${SHA:0:7}\`** · [workflow run]($RUN_URL)"
            echo
            section tests-summary.md Tests
            section coverage-summary.md Coverage
            section eslint-summary.md ESLint
            section formatting-summary.md Prettier
            section typecheck-summary.md "The type check"
            section build-summary.md "The build"
          } > comment.md

          comment_id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@comment.md > /dev/null
            echo "Updated comment $comment_id"
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
            echo "Created a comment"
          fi
