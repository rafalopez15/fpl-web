version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Waits a week after a release, so a compromised one is usually pulled first.
    cooldown:
      default-days: 7
    # Minor and patch updates in one PR; each major update gets its own.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A package goes in the first group that matches. Next.js and React move
    # together at every level; everything else groups minor and patch, and each
    # other major update gets its own PR.
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
